            body {
                background-image: url('https://lh3.googleusercontent.com/pw/AP1GczP45WrcNRFkfEdBtjF0406p6akCV2FaVoLge_T5X7oYUDbcyhioWbGvLZeIEa9JVy1OHdovPuRDuKdKYP3Rymzmhqxf8EW-ptvi-b_RCtvy_gXUL2ZpSLmyTPB-KvYX8LQ6WiptG7Le2AH40VvJCl2V=w1024-h585-s-no-gm?authuser=0');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                position: relative;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: rgba(2, 6, 23, 0.68); /* 深色半透明暗化，確保UI清晰 */
                backdrop-filter: blur(2px);
                z-index: -1;
                pointer-events: none;
            }

            /* 柔和半透明金黃光圈跟隨滑鼠樣式 */
            #mouse-cursor-glow {
                position: fixed;
                top: 0;
                left: 0;
                width: 200px;
                height: 200px;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(251, 191, 36, 0.35) 0%, rgba(245, 158, 11, 0.15) 45%, rgba(245, 158, 11, 0) 70%);
                pointer-events: none;
                transform: translate(-50%, -50%);
                z-index: 9999;
                transition: transform 0.06s ease-out;
                mix-blend-mode: screen;
            }

            /* 右下角 Discord Widget 可收合懸浮框樣式 */
            #discord-floating-wrapper {
                position: fixed;
                bottom: 20px;
                right: 20px;
                z-index: 9990;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
            }

            #discord-widget-container {
                box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7), 0 10px 15px -5px rgba(0, 0, 0, 0.5);
                border-radius: 16px;
                overflow: hidden;
                border: 1px solid rgba(99, 102, 241, 0.4);
                background: #0f172a;
                margin-bottom: 10px;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                transform-origin: bottom right;
            }

            .discord-widget-hidden {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
                pointer-events: none;
                height: 0 !important;
                margin-bottom: 0 !important;
                border: none !important;
            }

            /* 地圖武俠對話框動畫與樣式 */
            @keyframes dialogFadeIn {
                from { opacity: 0; transform: scale(0.92) translateY(10px); }
                to { opacity: 1; transform: scale(1) translateY(0); }
            }

            .wuxia-dialog-overlay {
                position: fixed;
                inset: 0;
                z-index: 9995;
                background-color: rgba(0, 0, 0, 0.75);
                backdrop-filter: blur(4px);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem;
                animation: dialogFadeIn 0.25s ease-out forwards;
            }

            .wuxia-dialog-box {
                background: rgba(15, 23, 42, 0.92);
                border: 2px solid rgba(217, 119, 6, 0.6);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(217, 119, 6, 0.25);
                border-radius: 20px;
                max-width: 480px;
                width: 100%;
                padding: 24px;
                color: #fde68a;
                position: relative;
            }

            .error-boundary {
                border: 2px dashed rgba(255, 0, 0, 0.3);
                position: relative;
            }
            .error-boundary::after {
                content: "⚠️";
                position: absolute;
                top: 0;
                right: 0;
                background: rgba(255, 0, 0, 0.1);
                color: red;
                font-size: 14px;
                padding: 2px 6px;
                border-radius: 0 0 0 4px;
                pointer-events: none;
            }

            /* Custom Keyframe Animations */
            @keyframes shine {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(200%); }
            }
            @keyframes fadeInOut {
                0%, 100% { opacity: 0.2; transform: translateY(2px); }
                50% { opacity: 1; transform: translateY(0); }
            }
            /* 逆時針旋轉動畫 */
            @keyframes counterClockwiseSpin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(-360deg); }
            }
            /* BOSS 戰鬥框劇烈震動特效 */
            @keyframes bossShake {
                0% { transform: translate(0, 0) rotate(0deg); }
                20% { transform: translate(-3px, 2px) rotate(-0.5deg); }
                40% { transform: translate(3px, -2px) rotate(0.5deg); }
                60% { transform: translate(-2px, -2px) rotate(0deg); }
                80% { transform: translate(2px, 2px) rotate(-0.5deg); }
                100% { transform: translate(0, 0) rotate(0deg); }
            }
            .boss-shake-effect {
                animation: bossShake 0.35s ease-in-out infinite;
            }

            body {
                @apply text-foreground;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            }

            input, textarea, select {
                @apply bg-background text-foreground border-input placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring;
            }

            button {
                @apply bg-primary text-primary-foreground hover:bg-primary/90 disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2;
            }

            ::selection {
                @apply bg-amber-600 text-white;
            }
        </style>

        atk: slot === "weapon" || slot === "ring" ? baseVal + 5 : 0,

    };

      setInventory((prev) => [...prev, item]);
      addLog(`卸下了【${item.name}】`, "info");
    };

      AudioManager.btnClick();
      let count = 0;
      Object.keys(SLOT_MAP).forEach((slot) => {
        const candidates = inventory.filter((i) => i.type === "equip" && i.slot === slot);
        if (candidates.length === 0) return;
        candidates.sort((a, b) => RARITY_MAP[b.rarity].val + b.atk + b.def - (RARITY_MAP[a.rarity].val + a.atk + a.def));
        const best = candidates[0];
        const current = equipment[slot];
        if (!current || RARITY_MAP[best.rarity].val + best.atk + best.def > RARITY_MAP[current.rarity].val + current.atk + current.def) {
          equipItem(best);
          count++;
        }
      });
      addLog(`一鍵裝備完成，共替換了 ${count} 件最高戰力裝備！`, "success");
