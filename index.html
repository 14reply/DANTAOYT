        <style>
            .error-boundary {
                border: 2px dashed rgba(255, 0, 0, 0.3);
                position: relative;
            }
            .error-boundary::after {
                content: "⚠️";
                position: absolute;
                top: 0;
                right: 0;
                background: rgba(255, 0, 0, 0.1);
                color: red;
                font-size: 14px;
                padding: 2px 6px;
                border-radius: 0 0 0 4px;
                pointer-events: none;
            }
            .loading-spinner {
                @apply flex items-center justify-center min-h-[200px] bg-gradient-to-br from-white/5 to-white/10 rounded-xl backdrop-blur-sm;
            }
            .loading-spinner::after {
                content: '';
                @apply w-12 h-12 border-4 border-primary/20 border-t-primary rounded-full animate-spin shadow-lg;
            }

            @keyframes shine {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(200%); }
            }
            @keyframes fadeInOut {
                0%, 100% { opacity: 0.2; transform: translateY(2px); }
                50% { opacity: 1; transform: translateY(0); }
            }

            body {
                @apply bg-background text-foreground;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            }

            input, textarea, select {
                @apply bg-background text-foreground border-input placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring;
            }

            input:not(:placeholder-shown), textarea:not(:placeholder-shown), select:not(:placeholder-shown) {
                @apply bg-background;
            }

            .dark input, .dark textarea, .dark select {
                @apply bg-background/95;
            }

            input, textarea, select {
                @apply bg-background/95;

            }

            button.secondary {
                @apply bg-secondary text-secondary-foreground hover:bg-secondary/80;
            }

            .card {
                @apply bg-card text-card-foreground border border-border rounded-lg shadow-sm;
            }

            .popover {
                @apply bg-popover text-popover-foreground border border-border shadow-md rounded-md;
            }

            a {
                @apply text-primary hover:text-primary/80 focus:outline-none focus:ring-2 focus:ring-ring;
            }

            .text-muted {
                @apply text-muted-foreground;
            }

            .bg-accent {
                @apply bg-accent text-accent-foreground;
            }

            .destructive {
                @apply bg-destructive text-destructive-foreground hover:bg-destructive/90;
            }

            pre, code {
                @apply bg-muted text-muted-foreground rounded px-[0.3em] py-[0.2em];
            }

            table {
                @apply border-collapse w-full;
            }

            th, td {
                @apply border border-border p-2 text-left;
            }

            th {
                @apply bg-muted font-semibold;
            }

            .badge {
                @apply inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold bg-primary/10 text-primary-foreground;
            }

            :focus-visible {
                @apply outline-none ring-2 ring-ring ring-offset-2;
            }

            ::selection {
                @apply bg-amber-600 text-white;
            }
        </style>
